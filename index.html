import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#0b0813"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"

    bundle = "pygbag_game"

    appdir = Path(f"/data/data/{bundle}") # /data/data/pygbag_game
    appdir.mkdir()

    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("pygbag_game.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("pygbag_game.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)

    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # test/wait user media interaction
    if not platform.window.MM.UME:
        __import__(__name__).__file__ = main

        msg = "✨ TAP SCREEN TO START GAME ✨"
        platform.window.infobox.innerText = msg
        platform.window.show_infobox()
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.infobox.innerText = f"Initializing: {pkg}..."

    await shell.source(main, callback=ui_callback)

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("The Awaiting Stars: Engine Active!")

    shell.interactive()

asyncio.run( custom_site() )

function toggleFullscreen() {
    const doc = window.document;
    const docEl = doc.documentElement;
    const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
    const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

    if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
            requestFullScreen.call(docEl).catch(function(){});
        }
    } else {
        if (cancelFullScreen) {
            cancelFullScreen.call(doc).catch(function(){});
        }
    }
}

// Auto-request fullscreen on first touch engagement on mobile
document.addEventListener('pointerdown', function tryFullscreenOnFirstTap() {
    if (window.innerWidth <= 1024) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen && !document.fullscreenElement) {
            docEl.requestFullscreen().catch(function(){});
        }
    }
    document.removeEventListener('pointerdown', tryFullscreenOnFirstTap);
}, { once: true });

function checkOrientation() {
    const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth < 768;
    const prompt = document.getElementById('rotate-prompt');
    if (prompt) {
        prompt.style.display = isPortrait ? 'flex' : 'none';
    }
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);
window.addEventListener('load', checkOrientation);
